name: Deploy Stepside Backoffice API

on:
  push:
    branches: [ main ] # Cambialo por master si esa es tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 21
      uses: actions/setup-java@v4.2.2
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Copy files to Server via SCP
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "target/*.jar,Dockerfile"
        target: "/home/ubuntu/stepside-bo/" # Ruta corregida para el Backoffice

    # --------------------------------------------------------------------------
    # PASO 5: Ejecutar comandos remotos mediante SSH para reestructurar y levantar Docker
    # --------------------------------------------------------------------------
    - name: Executing remote SSH commands to deploy
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/ubuntu/stepside-bo
          
          # 1. 🚀 SALVAGUARDA DE PUERTO: Remueve cualquier contenedor viejo con este nombre global
          sudo docker rm -f stepside-bo-container || true
          
          # 2. Detener de forma limpia el entorno del directorio actual
          sudo docker-compose down || true
          
          # 3. Mover el nuevo .jar compilado hacia la raíz del proyecto
          mv target/StepSide-*.jar app.jar || true
          rm -rf target
          
          # 4. Rescatar el Dockerfile enviado por GitHub
          mv stepside_v2/Dockerfile ./ 2>/dev/null || true
          rm -rf stepside_v2
          
          # 5. Levantar el contenedor aplicando la inyección del archivo .env local
          sudo docker-compose up -d --build stepside-bo
